{% extends 'backoffice/base.html' %}{% block content %}<div class="card card-primary card-outline"><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="card-body">{{ form.non_field_errors }}<div class="row">{% for field in form %}<div class="col-md-6 form-group"><label for="{{ field.id_for_label }}">{{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label><div>{{ field }}</div>{% if field.help_text %}<small class="form-text text-muted">{{ field.help_text|striptags }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}</div></div><div class="card-footer"><button class="btn btn-primary">บันทึกข้อมูล</button>{% if app %}<a class="btn btn-default" href="{% url 'backoffice:list' app name %}">กลับรายการ</a>{% endif %}</div></form></div>{% endblock %}
